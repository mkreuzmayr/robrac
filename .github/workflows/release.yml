name: Release

# Pushing a `v*` tag is what publishes. `changeset version` only writes the version
# and the changelog; it never publishes (version-only mode).
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  # Everything that runs third-party code happens here, without publish rights.
  build:
    name: build ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Releases are cut from `main`; a tag on any other commit never publishes.
      - name: Tag must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi

      - name: Tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      # The changelog section for this version is the release notes. Checked before
      # anything irreversible happens.
      - name: Slice the changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::no '## $version' section in CHANGELOG.md"
            exit 1
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

      - run: pnpm format:check

      - name: Pack the tarball
        run: |
          pnpm pack --pack-destination ./pack
          tar -tzf ./pack/*.tgz | sort
          if tar -tzf ./pack/*.tgz | grep -q '\.map$'; then
            echo "::error::sourcemaps leaked into the published tarball"
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: |
            pack/*.tgz
            release-notes.md
          retention-days: 7

  # Publishes the exact tarball `build` verified. No checkout, no install, no build.
  publish:
    name: publish ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in the repository settings, and
    # name it in the npm trusted-publisher configuration.
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) lives in the npm CLI and needs npm 11.5.1+.
      - run: npm install -g npm@11.21.1

      - name: Publish to npm (OIDC)
        run: npm publish ./pack/*.tgz --access public

  github-release:
    name: release notes ${{ github.ref_name }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --notes-file release-notes.md
